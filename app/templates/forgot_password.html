{% extends "base.html" %}
{% block login_content %}
<div class="card" style="max-width: 450px; margin: 40px auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
    <div class="card-body" style="padding: 40px 30px;">
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="{{ url_for('static', filename='img/casevault-logo.png') }}" alt="Logo" style="max-width: 80px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        </div>
        <h3 class="text-center" style="font-weight: 900; color: #1e293b; margin-bottom: 10px; letter-spacing: -0.5px;">Recover Account</h3>
        <p style="text-align: center; color: #64748b; font-size: 0.9em; margin-bottom: 25px;">Enter your email and your 16-character Recovery Passkey.</p>
        
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-size: 0.85em; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">Email Address</label>
                <input type="email" name="email" class="form-control" required style="padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc;">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-size: 0.85em; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">Recovery Passkey</label>
                <input type="text" name="passkey" placeholder="XXXX-XXXX-XXXX-XXXX" class="form-control" required style="padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; font-family: monospace; font-weight: bold; letter-spacing: 2px;">
            </div>
            <div class="form-group" style="margin-bottom: 30px;">
                <label style="font-size: 0.85em; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">New Password</label>
                <input type="password" name="new_password" class="form-control" required style="padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1.05em; background-color: #0f172a; border: none; box-shadow: 0 4px 6px rgba(15, 23, 42, 0.25);">Reset Password</button>
        </form>
        
        <div style="margin-top: 25px; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 25px;">
            <a href="{{ url_for('auth.login') }}" style="color: #3b82f6; font-weight: bold; text-decoration: none;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
