{% extends "base.html" %}
{% block login_content %}
<div class="card" style="max-width: 450px; margin: 40px auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
    <div class="card-body" style="padding: 40px 30px;">
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="{{ url_for('static', filename='img/casevault-logo.png') }}" alt="Logo" style="max-width: 80px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        </div>
        <h3 class="text-center" style="font-weight: 900; color: #1e293b; margin-bottom: 25px; letter-spacing: -0.5px;">CaseVault Login</h3>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-size: 0.85em; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">Official Email Address</label>
                <input type="email" name="email" class="form-control" required style="padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc;">
            </div>
            <div class="form-group" style="margin-bottom: 30px;">
                <label style="font-size: 0.85em; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">Password</label>
                <input type="password" name="password" class="form-control" required style="padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1.05em; background-color: #3b82f6; border: none; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);">Sign In Securely</button>
        </form>
        
        <div style="margin-top: 25px; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 25px;">
            <a href="{{ url_for('auth.forgot_password') }}" style="color: #3b82f6; font-size: 0.95em; text-decoration: none; display: block; margin-bottom: 12px; font-weight: 600;">Forgot password? Use Passkey</a>
            <span style="font-size: 0.95em; color: #64748b;">Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #3b82f6; font-weight: bold; text-decoration: none;">Sign up here</a></span>
        </div>
    </div>
</div>
{% endblock %}
